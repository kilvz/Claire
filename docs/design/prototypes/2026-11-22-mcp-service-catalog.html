<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mika MCP integration prototype</title>
  <style>
    /* Layout: Mika settings surfaces, centered app canvas, prototype controls kept outside it. */
    :root {
      --bg: #f7f7f8;
      --surface: #ffffff;
      --fill: rgba(0, 0, 0, .04);
      --ink: #1c1c1e;
      --ink-2: #5f6068;
      --ink-3: #85868e;
      --hair: rgba(0, 0, 0, .08);
      --edge: rgba(0, 0, 0, .07);
      --accent: #0a7cff;
      --accent-soft: rgba(10, 124, 255, .10);
      --on-accent: #ffffff;
      --ok: #1f9d55;
      --ok-soft: rgba(31, 157, 85, .12);
      --warn: #a86400;
      --warn-soft: rgba(255, 159, 10, .12);
      --bad: #e5483d;
      --bad-soft: rgba(229, 72, 61, .10);
      --neutral-soft: rgba(0, 0, 0, .045);
      --shadow: rgba(0, 0, 0, .08);
      --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      --font-utility: ui-monospace, "SFMono-Regular", Consolas, monospace;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e0e10;
        --surface: #1a1a1d;
        --fill: rgba(255, 255, 255, .06);
        --ink: #f2f2f4;
        --ink-2: #a4a5ad;
        --ink-3: #7d7e86;
        --hair: rgba(255, 255, 255, .09);
        --edge: rgba(255, 255, 255, .07);
        --accent: #3d97ff;
        --accent-soft: rgba(61, 151, 255, .16);
        --ok: #3ccf7a;
        --ok-soft: rgba(60, 207, 122, .14);
        --warn: #ffb340;
        --warn-soft: rgba(255, 159, 10, .16);
        --bad: #ff6961;
        --bad-soft: rgba(255, 105, 97, .14);
        --neutral-soft: rgba(255, 255, 255, .07);
        --shadow: rgba(0, 0, 0, .28);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0e0e10;
      --surface: #1a1a1d;
      --fill: rgba(255, 255, 255, .06);
      --ink: #f2f2f4;
      --ink-2: #a4a5ad;
      --ink-3: #7d7e86;
      --hair: rgba(255, 255, 255, .09);
      --edge: rgba(255, 255, 255, .07);
      --accent: #3d97ff;
      --accent-soft: rgba(61, 151, 255, .16);
      --ok: #3ccf7a;
      --ok-soft: rgba(60, 207, 122, .14);
      --warn: #ffb340;
      --warn-soft: rgba(255, 159, 10, .16);
      --bad: #ff6961;
      --bad-soft: rgba(255, 105, 97, .14);
      --neutral-soft: rgba(255, 255, 255, .07);
      --shadow: rgba(0, 0, 0, .28);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.55;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      padding-block: 20px 32px;
    }
    button, input, select, textarea { font: inherit; }
    button, select { cursor: pointer; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible, a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; }
    h1 { font-size: 22px; line-height: 1.3; letter-spacing: -.02em; }
    h2 { font-size: 18px; line-height: 1.4; }
    h3 { font-size: 15px; line-height: 1.45; }
    .demo { max-width: 1240px; margin: 0 auto; }
    .demo-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .demo-title { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; }
    .demo-title strong { font-size: 16px; }
    .demo-note { color: var(--ink-2); font-size: 12px; }
    .demo-controls { display: flex; flex-wrap: wrap; gap: 8px; }
    .demo-control { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--edge); border-radius: 10px; background: var(--surface); }
    .demo-control button { border: 0; border-radius: 7px; background: transparent; padding: 5px 10px; font-size: 12px; }
    .demo-control button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .demo-layout { display: grid; grid-template-columns: 176px minmax(0, 1fr); gap: 24px; align-items: start; }
    .page-nav { position: sticky; top: 20px; display: grid; gap: 3px; }
    .page-nav-label { padding: 0 10px 7px; color: var(--ink-3); font-size: 11px; letter-spacing: .08em; }
    .page-nav button { width: 100%; border: 0; border-radius: 9px; background: transparent; text-align: left; padding: 8px 10px; color: var(--ink-2); font-size: 13px; }
    .page-nav button:hover { background: var(--fill); color: var(--ink); }
    .page-nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .page-picker { display: none; width: 100%; margin-bottom: 12px; }
    .canvas { min-width: 0; }
    .app-frame {
      width: 100%;
      max-width: 400px;
      min-height: 690px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid var(--edge);
      border-radius: 24px;
      background: var(--bg);
      box-shadow: 0 16px 48px var(--shadow);
      transition: max-width 220ms ease;
    }
    .app-frame.wide { max-width: 880px; border-radius: 20px; }
    .app-header {
      min-height: 62px;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 42px;
      align-items: center;
      gap: 4px;
      padding: 10px 14px 6px;
      background: var(--bg);
    }
    .app-header h1 { text-align: center; font-size: 18px; overflow-wrap: anywhere; }
    .icon-button { width: 38px; height: 38px; display: inline-grid; place-items: center; border: 0; border-radius: 11px; background: transparent; }
    .icon-button:hover { background: var(--fill); }
    .icon-button svg { width: 20px; height: 20px; }
    .app-content { padding: 10px 18px 24px; }
    .wide .app-content { padding: 16px 28px 30px; }
    .stack { display: grid; gap: 14px; }
    .stack-sm { display: grid; gap: 8px; }
    .section-label { color: var(--ink-2); font-size: 12px; font-weight: 600; padding: 2px 4px 0; }
    .muted { color: var(--ink-2); }
    .quiet { color: var(--ink-3); }
    .small { font-size: 12px; }
    .caption { color: var(--ink-2); font-size: 12px; line-height: 1.6; }
    .card { background: var(--surface); border: 1px solid var(--edge); border-radius: 14px; overflow: hidden; }
    .card-pad { padding: 16px; }
    .row { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .row > .grow { flex: 1; min-width: 0; }
    .list-row { width: 100%; display: flex; align-items: center; gap: 12px; min-width: 0; padding: 13px 14px; border: 0; border-bottom: 1px solid var(--hair); background: transparent; text-align: left; }
    .list-row:last-child { border-bottom: 0; }
    button.list-row:hover { background: var(--fill); }
    .service-icon { flex: 0 0 auto; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: var(--neutral-soft); color: var(--ink-2); font-size: 14px; font-weight: 700; letter-spacing: -.02em; }
    .service-icon.large { width: 54px; height: 54px; border-radius: 16px; font-size: 18px; }
    .row-title { display: block; font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
    .row-subtitle { display: block; color: var(--ink-2); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
    .chevron { flex: 0 0 auto; color: var(--ink-3); }
    .chevron svg { display: block; width: 16px; height: 16px; }
    .button { min-height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 0; border-radius: 11px; padding: 9px 16px; background: var(--accent); color: var(--on-accent); font-weight: 600; }
    .button:hover { filter: brightness(.96); }
    .button.secondary { background: var(--fill); color: var(--ink); }
    .button.ghost { background: transparent; color: var(--accent); }
    .button.danger { background: var(--bad-soft); color: var(--bad); }
    .button.full { width: 100%; }
    .button.small-button { min-height: 34px; padding: 6px 12px; border-radius: 9px; font-size: 12px; }
    .button-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .button-row > .button { flex: 1; }
    .text-button { border: 0; background: transparent; color: var(--accent); padding: 4px; text-align: left; }
    .hero-empty { padding: 34px 20px 26px; text-align: center; display: grid; justify-items: center; gap: 12px; }
    .empty-mark { width: 66px; height: 66px; display: grid; place-items: center; border-radius: 20px; background: var(--neutral-soft); color: var(--ink-2); }
    .empty-mark svg { width: 30px; height: 30px; }
    .search-wrap { position: relative; }
    .search-wrap svg { position: absolute; left: 13px; top: 12px; width: 18px; height: 18px; color: var(--ink-3); pointer-events: none; }
    .search { width: 100%; min-height: 42px; border: 1px solid var(--edge); border-radius: 12px; background: var(--surface); color: var(--ink); padding: 9px 12px 9px 40px; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip { border: 1px solid var(--edge); border-radius: 999px; background: var(--surface); color: var(--ink-2); padding: 5px 11px; font-size: 12px; }
    .chip[aria-pressed="true"] { border-color: transparent; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .service-grid { display: grid; gap: 10px; }
    .wide .service-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .service-card { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; border: 1px solid var(--edge); border-radius: 14px; background: var(--surface); padding: 14px; text-align: left; }
    .service-card:hover { border-color: var(--accent); }
    .service-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .badge { display: inline-flex; align-items: center; gap: 5px; width: fit-content; border-radius: 6px; padding: 2px 7px; background: var(--fill); color: var(--ink-2); font-size: 11px; }
    .badge.ok { background: var(--ok-soft); color: var(--ok); }
    .badge.warn { background: var(--warn-soft); color: var(--warn); }
    .badge.bad { background: var(--bad-soft); color: var(--bad); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .custom-footer { padding-top: 4px; text-align: center; }
    .detail-head { display: flex; align-items: center; gap: 14px; padding: 4px 2px 6px; }
    .detail-head p { margin-top: 3px; }
    .info-list { display: grid; gap: 0; }
    .info-item { display: grid; grid-template-columns: 86px minmax(0, 1fr); gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--hair); }
    .info-item:last-child { border-bottom: 0; }
    .info-item dt { color: var(--ink-2); }
    .info-item dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
    .field { display: grid; gap: 6px; min-width: 0; }
    .field label, .field-label { color: var(--ink-2); font-size: 12px; font-weight: 500; }
    .field input, .field select, .field textarea, .page-picker {
      width: 100%; min-height: 42px; border: 1px solid var(--edge); border-radius: 11px; background: var(--surface); color: var(--ink); padding: 9px 11px;
    }
    .field textarea { min-height: 76px; resize: vertical; }
    .field-help { color: var(--ink-3); font-size: 11px; }
    .required { color: var(--bad); }
    .notice { display: flex; align-items: flex-start; gap: 10px; border-radius: 12px; padding: 12px; background: var(--fill); color: var(--ink-2); font-size: 12px; }
    .notice.ok { background: var(--ok-soft); color: var(--ok); }
    .notice.warn { background: var(--warn-soft); color: var(--warn); }
    .notice.bad { background: var(--bad-soft); color: var(--bad); }
    .notice svg { flex: 0 0 auto; width: 18px; height: 18px; margin-top: 1px; }
    .package { font-family: var(--font-utility); font-size: 12px; overflow-wrap: anywhere; }
    .progress { height: 4px; overflow: hidden; border-radius: 999px; background: var(--fill); }
    .progress::after { content: ""; display: block; width: 42%; height: 100%; border-radius: inherit; background: var(--accent); animation: progress 1.1s ease-in-out infinite alternate; }
    @keyframes progress { from { transform: translateX(-10%); } to { transform: translateX(150%); } }
    .spinner { width: 42px; height: 42px; border: 3px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-hero { display: grid; justify-items: center; text-align: center; gap: 12px; padding: 30px 8px 18px; }
    .state-icon { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 18px; background: var(--ok-soft); color: var(--ok); }
    .state-icon.bad { background: var(--bad-soft); color: var(--bad); }
    .state-icon svg { width: 28px; height: 28px; }
    .switch { position: relative; flex: 0 0 auto; width: 42px; height: 25px; border: 0; border-radius: 99px; background: var(--fill); padding: 2px; }
    .switch::after { content: ""; display: block; width: 21px; height: 21px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px var(--shadow); transition: transform 180ms ease; }
    .switch[aria-checked="true"] { background: var(--accent); }
    .switch[aria-checked="true"]::after { transform: translateX(17px); }
    details { border-radius: 12px; background: var(--fill); padding: 10px 12px; }
    summary { cursor: pointer; color: var(--ink-2); font-weight: 500; }
    details > div { padding-top: 10px; }
    .tool-list { display: grid; gap: 8px; padding-top: 8px; }
    .tool { padding: 10px 12px; border-radius: 10px; background: var(--fill); }
    .tool code { font-family: var(--font-utility); font-size: 12px; color: var(--ink); }
    .divider { height: 1px; background: var(--hair); }
    .demo-flow { max-width: 880px; margin: 12px auto 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; color: var(--ink-3); font-size: 11px; }
    .demo-flow button { border: 0; background: transparent; color: var(--ink-3); text-decoration: underline; text-underline-offset: 3px; padding: 4px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 800px) {
      body { padding-block: 12px 24px; }
      .demo-layout { display: block; }
      .page-nav { display: none; }
      .page-picker { display: block; }
      .app-frame { min-height: 0; border-radius: 18px; }
      .demo-top { align-items: flex-start; }
    }
    @media (max-width: 430px) {
      body { padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
      .demo-title { display: grid; gap: 1px; }
      .app-content { padding: 8px 14px 22px; }
      .button-row.stack-narrow { display: grid; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="demo">
    <div class="demo-top">
      <div class="demo-title">
        <strong>Mika · MCP integration prototype</strong>
        <span class="demo-note">Local demo only; all services and data are fictional</span>
      </div>
      <div class="demo-controls" aria-label="Prototype display settings">
        <div class="demo-control" aria-label="Appearance">
          <button type="button" data-theme="light" aria-pressed="true">Light</button>
          <button type="button" data-theme="dark" aria-pressed="false">Dark</button>
        </div>
        <div class="demo-control" aria-label="Canvas width">
          <button type="button" data-width="phone" aria-pressed="true">Phone</button>
          <button type="button" data-width="wide" aria-pressed="false">Wide</button>
        </div>
      </div>
    </div>
    <div class="demo-layout">
      <nav class="page-nav" id="page-nav" aria-label="Prototype pages"></nav>
      <div class="canvas">
        <label class="sr-only" for="page-picker">Select prototype page</label>
        <select class="page-picker" id="page-picker"></select>
        <section class="app-frame" id="app-frame" aria-label="Mika app screen preview">
          <div id="app"></div>
        </section>
        <div class="demo-flow" id="demo-flow" aria-label="Prototype state shortcuts"></div>
      </div>
    </div>
  </main>
  <script>
    const icons = {
      back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>',
      chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>',
      search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',
      link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.1-1.1"/></svg>',
      check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>',
      alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 17h.01"/></svg>',
      info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg>'
    };
    const pages = [
      ['catalog', 'Service catalog'], ['home-empty', 'Empty home'], ['home', 'Home with services'],
      ['oauth', 'OAuth authorization'], ['fields', 'Multi-field keys'], ['open', 'No-auth connection'],
      ['package', 'stdio package confirmation'], ['connecting', 'Connecting'], ['success', 'Connected'],
      ['failure', 'Recoverable failure'], ['manage', 'Service management'], ['custom', 'Custom server']
    ];
    const services = [
      { id: 'oauth', name: 'Yunfan Docs', mark: 'Y', category: 'Productivity', auth: 'Account authorization', summary: 'Find documents, read content and organize team materials.', page: 'oauth' },
      { id: 'fields', name: 'Beichen Data', mark: 'B', category: 'Data', auth: 'API Key', summary: 'Query datasets, run analyses and get structured results.', page: 'fields' },
      { id: 'open', name: 'Xingtu Search', mark: 'X', category: 'Search', auth: 'No authentication', summary: 'Search public information and return results with sources.', page: 'open' },
      { id: 'package', name: 'File Butler', mark: 'F', category: 'Local', auth: 'Local environment', summary: 'Find, read and organize files in authorized directories.', page: 'package' },
      { id: 'calendar', name: 'Moment Calendar', mark: 'M', category: 'Productivity', auth: 'Account authorization', summary: 'View schedules, create events and coordinate meeting times.', page: 'oauth' },
      { id: 'messages', name: 'Team Space', mark: 'T', category: 'Communication', auth: 'API Key', summary: 'Find channel messages, organize discussions and post updates.', page: 'fields' },
      { id: 'long', name: 'Yuanshan Knowledge Base', mark: 'K', category: 'Data', auth: 'Account authorization', summary: 'Search team knowledge across spaces, summarize longer materials while keeping sources, and help locate passages that need further confirmation.', page: 'oauth' }
    ];
    const state = {
      page: 'catalog', category: 'All', query: '', theme: 'light', width: 'phone',
      origin: 'oauth', enabled: true, deleteConfirm: false, advanced: false,
      customTransport: 'http', values: { workspace: 'demo-workspace', region: 'Asia Pacific' }
    };
    let connectTimer = null;

    function esc(value) {
      return String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function header(title, back = 'catalog', action = '') {
      return `<header class="app-header">
        ${back ? `<button class="icon-button" type="button" data-go="${back}" aria-label="Back">${icons.back}</button>` : '<span></span>'}
        <h1>${title}</h1>${action || '<span></span>'}
      </header>`;
    }
    function customFooter() {
      return `<div class="custom-footer"><button class="text-button" type="button" data-go="custom">Don't see what you need? Add a custom MCP server</button></div>`;
    }
    function serviceCard(service) {
      return `<button class="service-card" type="button" data-go="${service.page}">
        <span class="service-icon">${service.mark}</span>
        <span class="grow"><span class="row-title">${service.name}</span>
          <span class="row-subtitle">${service.summary}</span>
          <span class="service-meta"><span class="badge">${service.category}</span><span class="badge">${service.auth}</span></span>
        </span>
      </button>`;
    }
    function filteredServices() {
      const q = state.query.trim().toLowerCase();
      return services.filter(s => (state.category === 'All' || s.category === state.category) &&
        (!q || `${s.name} ${s.summary} ${s.category}`.toLowerCase().includes(q)));
    }
    function catalogResults() {
      const results = filteredServices();
      return results.length ? results.map(serviceCard).join('') :
        `<div class="card card-pad stack-sm"><strong>No matching services</strong><p class="caption">Try another keyword or category, or use a custom connection.</p><button class="button secondary full" type="button" data-go="custom">Custom MCP server</button></div>`;
    }
    function catalogPage() {
      const cats = ['All', 'Productivity', 'Data', 'Search', 'Communication', 'Local'];
      return `${header('Add MCP service', 'home')}<div class="app-content stack">
        <div class="search-wrap">${icons.search}<label class="sr-only" for="catalog-search">Search services</label><input class="search" id="catalog-search" type="search" placeholder="Search services or capabilities" value="${esc(state.query)}" autocomplete="off"></div>
        <div class="chips" aria-label="Service categories">${cats.map(c => `<button class="chip" type="button" data-category="${c}" aria-pressed="${state.category === c}">${c}</button>`).join('')}</div>
        <div class="row"><p class="caption grow">After choosing a service, you only authorize or fill in the necessary details.</p><span class="badge">Sample catalog</span></div>
        <div class="service-grid" id="service-results">${catalogResults()}</div>
        ${customFooter()}
      </div>`;
    }
    function emptyHome() {
      return `${header('MCP services', 'catalog')}<div class="app-content stack">
        <div class="card hero-empty">
          <span class="empty-mark">${icons.link}</span>
          <h2>Let Mika use more tools</h2>
          <p class="muted">Choose a service from the catalog, then authorize or enter a key to connect. No need to know addresses or connection protocols.</p>
        </div>
        <button class="button full" type="button" data-go="catalog">Browse service catalog</button>
        <button class="button secondary full" type="button" data-go="custom">Custom server</button>
        <p class="caption">Connected services provide tools when a task needs them. Each service can be disabled on its own.</p>
      </div>`;
    }
    function home() {
      return `${header('MCP services', 'catalog')}<div class="app-content stack">
        <div class="row"><p class="caption grow">Added services</p><button class="text-button" type="button" data-action="test-all">Test all</button></div>
        <div class="card">
          <button class="list-row" type="button" data-go="manage"><span class="service-icon">Y</span><span class="grow"><span class="row-title">Yunfan Docs</span><span class="row-subtitle"><span class="badge ok"><span class="dot"></span>Connected · 12 tools</span></span></span><span class="chevron">${icons.chevron}</span></button>
          <div class="list-row"><span class="service-icon">B</span><span class="grow"><span class="row-title">Beichen Data</span><span class="row-subtitle">Last verification failed · reconnect available</span></span><button class="switch" type="button" role="switch" aria-checked="${state.enabled}" aria-label="Enable Beichen Data" data-action="toggle"></button></div>
        </div>
        <button class="button full" type="button" data-go="catalog">Add MCP service</button>
        <p class="caption">A failing service does not affect other services or tasks. Open a service to view its tools, replace its key, or adjust settings.</p>
      </div>`;
    }
    function detailInfo(auth, account) {
      return `<dl class="info-list">
        <div class="info-item"><dt>Authentication</dt><dd>${auth}</dd></div>
        <div class="info-item"><dt>Account & cost</dt><dd>${account}</dd></div>
        <div class="info-item"><dt>Data notes</dt><dd>When a task runs, relevant content is sent to this service. Mika still treats returned content as untrusted data.</dd></div>
      </dl>`;
    }
    function oauthPage() {
      return `${header('Yunfan Docs')}<div class="app-content stack">
        <div class="detail-head"><span class="service-icon large">Y</span><div><h2>Yunfan Docs</h2><p class="muted">Docs & team materials</p></div></div>
        <p>Let Mika find documents, read content, and create or update documents after you confirm.</p>
        <div class="card card-pad">${detailInfo('Authorize with a Yunfan account', 'Requires a Yunfan account; free plan available')}</div>
        <div class="notice">${icons.info}<span>The system browser opens to complete authorization. When you return to Mika, the connection is verified and tools are read automatically.</span></div>
        <button class="button full" type="button" data-connect="oauth">Sign in to authorize</button>
        ${customFooter()}
      </div>`;
    }
    function fieldsPage() {
      return `${header('Beichen Data')}<div class="app-content stack">
        <div class="detail-head"><span class="service-icon large">B</span><div><h2>Beichen Data</h2><p class="muted">Multi-field authentication example</p></div></div>
        <p>Query datasets and run analyses. This service needs two keys and workspace details.</p>
        <div class="card card-pad stack">
          <div class="field"><label for="access-key">Access key <span class="required">Required</span></label><input id="access-key" type="password" autocomplete="off" placeholder="Enter access key"><span class="field-help">Encrypted and stored on this device; never written to the regular config.</span></div>
          <div class="field"><label for="signing-key">Signing key <span class="required">Required</span></label><input id="signing-key" type="password" autocomplete="off" placeholder="Enter signing key"></div>
          <div class="field"><label for="workspace">Workspace ID <span class="required">Required</span></label><input id="workspace" type="text" value="${esc(state.values.workspace)}" data-value="workspace" autocomplete="off"></div>
          <div class="field"><label for="region">Data region</label><select id="region" data-value="region"><option${state.values.region === 'Asia Pacific' ? ' selected' : ''}>Asia Pacific</option><option${state.values.region === 'Europe' ? ' selected' : ''}>Europe</option><option${state.values.region === 'North America' ? ' selected' : ''}>North America</option></select></div>
          <button class="text-button" type="button" data-action="key-help">Where do I get the keys?</button>
          <div class="notice" id="key-help" hidden>${icons.info}<span>Create them in Beichen Data under "Developer settings → Access credentials". This is a fictional example only.</span></div>
        </div>
        ${detailInfo('Two encrypted keys', 'Requires a developer account; billed per query')}
        <button class="button full" type="button" data-connect="fields">Connect and save</button>
        ${customFooter()}
      </div>`;
    }
    function openPage() {
      return `${header('Xingtu Search')}<div class="app-content stack">
        <div class="detail-head"><span class="service-icon large">X</span><div><h2>Xingtu Search</h2><p class="muted">Public information search</p></div></div>
        <p>Search public information and return results with sources; no account or key needed.</p>
        <div class="card card-pad">${detailInfo('No authentication', 'No account needed; the public service may have rate limits')}</div>
        <button class="button full" type="button" data-connect="open">Connect</button>
        ${customFooter()}
      </div>`;
    }
    function packagePage() {
      return `${header('File Butler')}<div class="app-content stack">
        <div class="detail-head"><span class="service-icon large">F</span><div><h2>File Butler</h2><p class="muted">Runs in a local sandbox</p></div></div>
        <p>Find, read and organize files in directories you authorize.</p>
        <div class="notice ok">${icons.check}<span>The local environment is ready. File access is still authorized separately by you.</span></div>
        <div class="card card-pad stack-sm">
          <h3>The runtime package must be downloaded the first time</h3>
          <dl class="info-list">
            <div class="info-item"><dt>Package</dt><dd class="package">@example/filepilot-mcp</dd></div>
            <div class="info-item"><dt>Source</dt><dd>Example official npm release page</dd></div>
            <div class="info-item"><dt>Version</dt><dd class="package">1.4.2 (pinned exactly)</dd></div>
          </dl>
          <p class="caption">It is downloaded and cached only after you confirm. The same version is not downloaded again later.</p>
        </div>
        <div class="button-row stack-narrow"><button class="button secondary" type="button" data-go="catalog">Cancel</button><button class="button" type="button" data-connect="package">Confirm download and connect</button></div>
        ${customFooter()}
      </div>`;
    }
    function connectingPage() {
      const packageStep = state.origin === 'package' ? 'Installing the confirmed package, then verifying the service…' : state.origin === 'oauth' ? 'Completing authorization and verifying the service…' : 'Verifying the connection and reading available tools…';
      return `${header('Connecting', null)}<div class="app-content">
        <div class="state-hero"><span class="spinner" aria-hidden="true"></span><h2>${state.origin === 'package' ? 'File Butler' : state.origin === 'fields' ? 'Beichen Data' : state.origin === 'open' ? 'Xingtu Search' : 'Yunfan Docs'}</h2><p class="muted" role="status">${packageStep}</p></div>
        <div class="stack"><div class="progress" aria-hidden="true"></div><p class="caption">The service is enabled only after both the connection and the tool read succeed.</p><button class="button secondary full" type="button" data-action="cancel-connect">Cancel</button></div>
      </div>`;
    }
    function successPage() {
      return `${header('Connected', null)}<div class="app-content stack">
        <div class="state-hero"><span class="state-icon">${icons.check}</span><h2>Yunfan Docs is connected</h2><p class="muted">Read <strong>12 tools</strong>; the service is enabled.</p></div>
        <div class="card card-pad stack-sm"><h3>Next</h3><p class="caption">Mika uses these tools in suitable tasks. You can disable the service or change authorization at any time.</p></div>
        <div class="button-row"><button class="button secondary" type="button" data-action="show-tools">View tools</button><button class="button" type="button" data-go="home">Done</button></div>
        <div class="tool-list" id="success-tools" hidden><div class="tool"><code>search_documents</code><p class="caption">Find documents by keyword</p></div><div class="tool"><code>read_document</code><p class="caption">Read the content of a given document</p></div><div class="tool"><code>list_spaces</code><p class="caption">List accessible spaces</p></div></div>
        ${customFooter()}
      </div>`;
    }
    function failurePage() {
      return `${header('Connection not completed', null)}<div class="app-content stack">
        <div class="state-hero"><span class="state-icon bad">${icons.alert}</span><h2>The key failed verification</h2><p class="muted">Beichen Data rejected the access key. Check that the key is complete and has not expired.</p></div>
        <div class="notice bad">${icons.alert}<span>The configuration is saved as disabled and the service is not enabled. Non-secret fields are kept.</span></div>
        <div class="button-row"><button class="button secondary" type="button" data-connect="fields">Retry</button><button class="button" type="button" data-go="fields">Edit keys</button></div>
        <details><summary>View technical details</summary><div><p class="caption">The service returned an authentication failure (401). Mika did not save or display the key contents.</p><p class="package">MCP_AUTHENTICATION_FAILED</p></div></details>
        ${customFooter()}
      </div>`;
    }
    function managePage() {
      return `${header('Yunfan Docs', 'home')}<div class="app-content stack">
        <div class="detail-head"><span class="service-icon large">Y</span><div class="grow"><h2>Yunfan Docs</h2><p><span class="badge ok"><span class="dot"></span>Connected</span></p></div><button class="switch" type="button" role="switch" aria-checked="${state.enabled}" aria-label="Enable Yunfan Docs" data-action="toggle"></button></div>
        <p class="caption">Last verified: today 14:32 · 12 tools</p>
        <div class="card">
          <button class="list-row" type="button" data-action="retest"><span class="grow row-title">Test again</span><span class="chevron">${icons.chevron}</span></button>
          <button class="list-row" type="button" data-go="oauth"><span class="grow row-title">Reauthorize</span><span class="chevron">${icons.chevron}</span></button>
          <button class="list-row" type="button" data-go="custom"><span class="grow row-title">Advanced settings</span><span class="chevron">${icons.chevron}</span></button>
        </div>
        <div class="stack-sm"><h3>Available tools</h3><div class="tool"><code>search_documents</code><p class="caption">Find documents by keyword</p></div><div class="tool"><code>read_document</code><p class="caption">Read the content of a given document</p></div><div class="tool"><code>create_document</code><p class="caption">Create a new document; follows task confirmation rules before running</p></div><button class="text-button" type="button" data-action="show-tools">View all 12 tools</button></div>
        <div class="notice" id="manage-notice" hidden>${icons.info}<span>Demo action completed; no real network request was made.</span></div>
        <div class="divider"></div>
        <button class="button danger full" type="button" data-action="delete">Remove from Mika</button>
        <p class="caption">Only the configuration in Mika is removed; authorization for your Yunfan account is not revoked.</p>
        <div class="card card-pad stack-sm" id="delete-confirm" ${state.deleteConfirm ? '' : 'hidden'}><strong>Delete this service?</strong><p class="caption">Saved configuration and authorization info are removed from Mika.</p><div class="button-row"><button class="button secondary" type="button" data-action="cancel-delete">Cancel</button><button class="button danger" type="button" data-go="home-empty">Delete</button></div></div>
      </div>`;
    }
    function customPage() {
      const isStdio = state.customTransport === 'stdio';
      return `${header('Custom MCP server', 'catalog')}<div class="app-content stack">
        <p class="caption">For services not in the catalog, or connections you need to tune yourself.</p>
        <div class="card card-pad stack">
          <div class="field"><label for="custom-name">Name <span class="required">Required</span></label><input id="custom-name" type="text" placeholder="My MCP service"></div>
          <div class="field"><label for="custom-address">${isStdio ? 'Startup command' : 'Server address'} <span class="required">Required</span></label>${isStdio ? '<textarea id="custom-address" placeholder="Executable and arguments"></textarea><span class="field-help">Arguments are not run through a shell. For secrets, use the environment variable field below.</span>' : '<input id="custom-address" type="url" placeholder="https://example.com/mcp">'}</div>
          <div class="field"><label for="custom-auth">Authentication</label><select id="custom-auth"><option>Bearer Token</option><option>OAuth account authorization</option><option>Specified secret header</option><option>No authentication</option></select></div>
          <div class="field"><label for="custom-token">Key or token</label><input id="custom-token" type="password" autocomplete="off" placeholder="Stored encrypted"></div>
        </div>
        <details ${state.advanced ? 'open' : ''}><summary data-action="advanced">Advanced settings</summary><div class="stack">
          <div class="field"><label for="custom-transport">Transport</label><select id="custom-transport" data-action="transport"><option value="http"${!isStdio ? ' selected' : ''}>Streamable HTTP</option><option value="sse">Legacy HTTP + SSE</option><option value="stdio"${isStdio ? ' selected' : ''}>stdio (Linux sandbox)</option></select></div>
          <div class="field"><label for="custom-headers">Regular headers</label><textarea id="custom-headers" placeholder="X-Tenant: demo&#10;X-Region: apac"></textarea><span class="field-help">Secret headers use a separate encrypted field; do not enter them here.</span></div>
          <div class="field"><label for="custom-env">stdio secret environment variables</label><textarea id="custom-env" placeholder="SERVICE_API_KEY=••••••"></textarea></div>
          <div class="field"><label for="custom-allowlist">Tool allowlist</label><input id="custom-allowlist" type="text" placeholder="Leave empty to enable all discovered tools"></div>
          <div class="row"><span class="grow">Allow local HTTP</span><button class="switch" type="button" role="switch" aria-checked="false" aria-label="Allow local HTTP" data-action="toggle"></button></div>
          <div class="row"><span class="grow">Trust risk annotations provided by the service</span><button class="switch" type="button" role="switch" aria-checked="false" aria-label="Trust risk annotations" data-action="toggle"></button></div>
          <div class="field"><label for="custom-timeout">Connection timeout (seconds)</label><input id="custom-timeout" type="number" value="15" min="1"></div>
          <div class="field"><label for="custom-preview">Result preview length</label><input id="custom-preview" type="number" value="4000" min="0"></div>
          <div class="field"><label for="custom-budget">Per-task cost budget</label><input id="custom-budget" type="text" placeholder="Use the task's default budget"></div>
        </div></details>
        <div class="notice">${icons.info}<span>Custom services use the same safety checks and task lifecycle as catalog presets.</span></div>
        <div class="button-row"><button class="button secondary" type="button" data-go="catalog">Cancel</button><button class="button" type="button" data-connect="custom">Save and test</button></div>
      </div>`;
    }
    function pageHtml() {
      switch (state.page) {
        case 'home-empty': return emptyHome();
        case 'home': return home();
        case 'oauth': return oauthPage();
        case 'fields': return fieldsPage();
        case 'open': return openPage();
        case 'package': return packagePage();
        case 'connecting': return connectingPage();
        case 'success': return successPage();
        case 'failure': return failurePage();
        case 'manage': return managePage();
        case 'custom': return customPage();
        default: return catalogPage();
      }
    }
    function flowShortcuts() {
      if (state.page === 'connecting') return '<span>Prototype controls:</span><button type="button" data-go="success">Demo success</button><button type="button" data-go="failure">Demo failure</button>';
      if (state.page === 'failure') return '<span>Check that inputs are kept, retry, and technical details.</span>';
      return '<span>Use the page list on the left to check every state; click a card to continue the full flow.</span>';
    }
    function render() {
      clearTimeout(connectTimer);
      document.documentElement.dataset.theme = state.theme;
      document.querySelectorAll('[data-theme]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === state.theme)));
      document.querySelectorAll('[data-width]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.width === state.width)));
      document.getElementById('app-frame').classList.toggle('wide', state.width === 'wide');
      document.getElementById('app').innerHTML = pageHtml();
      document.getElementById('page-nav').innerHTML = '<div class="page-nav-label">Prototype pages</div>' + pages.map(([id, label]) => `<button type="button" data-go="${id}" ${state.page === id ? 'aria-current="page"' : ''}>${label}</button>`).join('');
      const picker = document.getElementById('page-picker');
      picker.innerHTML = pages.map(([id, label]) => `<option value="${id}"${state.page === id ? ' selected' : ''}>${label}</option>`).join('');
      document.getElementById('demo-flow').innerHTML = flowShortcuts();
    }
    function go(page) {
      state.page = page;
      if (page !== 'manage') state.deleteConfirm = false;
      render();
      const heading = document.querySelector('#app h1');
      if (heading) { heading.setAttribute('tabindex', '-1'); heading.focus({ preventScroll: true }); }
    }
    document.addEventListener('click', event => {
      const button = event.target.closest('button, summary');
      if (!button) return;
      if (button.dataset.theme) { state.theme = button.dataset.theme; render(); return; }
      if (button.dataset.width) { state.width = button.dataset.width; render(); return; }
      if (button.dataset.go) { go(button.dataset.go); return; }
      if (button.dataset.category) { state.category = button.dataset.category; render(); return; }
      if (button.dataset.connect) {
        state.origin = button.dataset.connect;
        state.page = 'connecting'; render();
        connectTimer = setTimeout(() => go('success'), 1400);
        return;
      }
      switch (button.dataset.action) {
        case 'cancel-connect': go(state.origin === 'custom' ? 'custom' : state.origin); break;
        case 'toggle': button.setAttribute('aria-checked', String(button.getAttribute('aria-checked') !== 'true')); state.enabled = !state.enabled; break;
        case 'key-help': { const el = document.getElementById('key-help'); el.hidden = !el.hidden; break; }
        case 'show-tools': { const el = document.getElementById('success-tools'); if (el) el.hidden = !el.hidden; else { const n = document.getElementById('manage-notice'); if (n) n.hidden = false; } break; }
        case 'retest': case 'test-all': { const n = document.getElementById('manage-notice'); if (n) n.hidden = false; else go('success'); break; }
        case 'delete': state.deleteConfirm = true; document.getElementById('delete-confirm').hidden = false; break;
        case 'cancel-delete': state.deleteConfirm = false; document.getElementById('delete-confirm').hidden = true; break;
        case 'advanced': state.advanced = !state.advanced; break;
      }
    });
    document.addEventListener('input', event => {
      if (event.target.id === 'catalog-search') {
        state.query = event.target.value;
        document.getElementById('service-results').innerHTML = catalogResults();
      }
      if (event.target.dataset.value) state.values[event.target.dataset.value] = event.target.value;
    });
    document.addEventListener('change', event => {
      if (event.target.id === 'page-picker') go(event.target.value);
      if (event.target.id === 'custom-transport') { state.customTransport = event.target.value; state.advanced = true; render(); }
      if (event.target.dataset.value) state.values[event.target.dataset.value] = event.target.value;
    });
    render();
  </script>
</body>
</html>
