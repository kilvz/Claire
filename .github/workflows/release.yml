name: Release

# Cut a release by pushing a tag `v<version>` (e.g. v1.0.0).
# Builds the debug APK on GitHub Actions and publishes it as a GitHub
# Release. Versioning scheme lives in VERSION.md (a.b.c, base = upstream Mika).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish Claire APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # compileSdk 36; build tools version takes AGP 8.7.3's default.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # Build only (no unit tests): :core:test has a pre-existing upstream
      # failure (DocsConsistencyTest, plan docs mention classes that do not
      # exist on upstream HEAD), so tests gate CI on main, not releases.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Claire-${version}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Claire ${{ github.ref_name }}
          body: |
            Claire ${{ github.ref_name }} — a fork of [Mika](https://github.com/wangzan101/Mika) by Wang Zan (Apache-2.0).

            Base version: upstream Mika 0.1.50. Versioning scheme: see VERSION.md (a.b.c; minor fix bumps c, feature bumps b, rebase bumps a).

            APK is debug-signed, package `com.wangzan101.mika`; it installs over Mika / earlier Claire builds.
          files: |
            dist/Claire-*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
