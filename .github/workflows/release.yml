name: Release

# Cut a release by pushing a tag `v<version>` (e.g. v1.0.0).
# Builds the debug APK on GitHub Actions and publishes it as a GitHub
# Release. Versioning scheme lives in VERSION.md (a.b.c, base = upstream Mika).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish Claire APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # compileSdk 36; build tools version takes AGP 8.7.3's default.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # Build only (no unit tests): tests already gate CI on main (ci.yml),
      # and a tag is only cut once that CI is green, so the release job just
      # builds the APK it publishes.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Claire-${version}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Claire ${{ github.ref_name }}
          body: |
            Claire ${{ github.ref_name }} — an AI assistant on your phone, in English from the first tap.

            Claire is a fork of [Mika](https://github.com/wangzan101/Mika) by Wang Zan, kept under the same Apache-2.0 license. What makes it Claire: English by default (first run and the agent's own instructions), OrcaRouter built in as a model provider, and its own versioning — this release is based on upstream Mika 0.1.50, see [VERSION.md](https://github.com/kilvz/Claire/blob/main/VERSION.md).

            Install the APK below (Android 11+, debug-signed, package `com.kilv.claire`; it installs alongside Mika, and over earlier `com.kilv.claire` builds). Then in Settings › Model, pick OrcaRouter and paste a key from [orcarouter.ai/console/token](https://www.orcarouter.ai/console/token) — the free model orcarouter/free costs nothing to try, or orcarouter/auto picks the model per prompt — or pick any other provider, or sign in with a ChatGPT, xAI or OpenRouter account.

            Verify the download against SHA256SUMS.txt.
          files: |
            dist/Claire-*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
