name: Release

# Cut a release by pushing a tag `v<version>` (e.g. v1.0.0).
# Builds the release APK on GitHub Actions and publishes it as a GitHub
# Release. Versioning scheme lives in VERSION.md (a.b.c, base = upstream Mika).
# The APK is signed with Claire's PERMANENT release key (GitHub secrets
# ANDROID_KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD,
# local backup ~/workspace/keystores/claire-release.keystore). NEVER sign
# releases with the debug key: GitHub runners generate a fresh debug key
# on every run, so a debug-signed release can never update over the
# previous one (1.2.0 failed to install over 1.1.0 exactly this way).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish Claire APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # compileSdk 36; build tools version takes AGP 8.7.3's default.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # Build only (no unit tests): tests already gate CI on main (ci.yml),
      # and a tag is only cut once that CI is green, so the release job just
      # builds the APK it publishes.
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/claire-release.keystore"
      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/claire-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-universal-release.apk "dist/Claire-${version}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Claire ${{ github.ref_name }}
          body: |
            Claire ${{ github.ref_name }} — an AI assistant on your phone, in English from the first tap.

            Claire is a fork of [Mika](https://github.com/wangzan101/Mika) by Wang Zan, kept under the same Apache-2.0 license. What makes it Claire: English by default (first run and the agent's own instructions), OrcaRouter built in as a model provider, and its own versioning — this release is based on upstream Mika 0.1.50, see [VERSION.md](https://github.com/kilvz/Claire/blob/main/VERSION.md).

            Install the APK below (Android 11+, release-signed with Claire's permanent key, package `com.kilv.claire`; it installs alongside Mika, and over earlier `com.kilv.claire` builds from 1.2.1 onward — if you still have 1.1.0 installed, uninstall it once first, its debug signature can never match the release key). Then in Settings › Model, pick OrcaRouter and paste a key from [orcarouter.ai/console/token](https://www.orcarouter.ai/console/token) — the free model orcarouter/free costs nothing to try, or orcarouter/auto picks the model per prompt — or pick any other provider, or sign in with a ChatGPT, xAI or OpenRouter account.

            New in 1.3.1: a Telegram bot channel in Settings, directly below WeChat: paste the bot token from BotFather on Telegram and your chat ID to let Claire answer you on Telegram.

            Verify the download against SHA256SUMS.txt.
          files: |
            dist/Claire-*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
