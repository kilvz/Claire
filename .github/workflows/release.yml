name: Release

# Cut a release by pushing a tag `v<version>` (e.g. v1.0.0).
# Builds the release APK on GitHub Actions and publishes it as a GitHub
# Release. Versioning scheme lives in VERSION.md (a.b.c, base = upstream Mika).
# The APK is signed with Claire's PERMANENT release key (GitHub secrets
# ANDROID_KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD,
# local backup ~/workspace/keystores/claire-release.keystore). NEVER sign
# releases with the debug key: GitHub runners generate a fresh debug key
# on every run, so a debug-signed release can never update over the
# previous one (1.2.0 failed to install over 1.1.0 exactly this way).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    name: Build and publish Claire APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # compileSdk 36; build tools version takes AGP 8.7.3's default.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # Build only (no unit tests): tests already gate CI on main (ci.yml),
      # and a tag is only cut once that CI is green, so the release job just
      # builds the APK it publishes.
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/claire-release.keystore"
      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/claire-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-universal-release.apk "dist/Claire-${version}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Claire ${{ github.ref_name }}
          # The release body says ONLY what changed in this version.
          # Update the "New in ..." line below for every release; never
          # re-add the intro / install / OrcaRouter boilerplate.
          body: |
            New in 2.2.2: the documentation now speaks as Claire throughout — the README, feature and setup guides, install-with-an-agent, MCP/CLI pages, FAQ, computer pages and developer docs all use Claire's name, package and releases instead of upstream Mika's. Install steps point at the real `com.kilv.claire` package, `Claire-<version>.apk` and Claire's `v2.2.x` tags, including the accessibility component and external-file paths. The bundled `mika` CLI now defaults to `com.kilv.claire`, so `mika connect` finds Claire without `--package`, and its messages say Claire. No app behaviour changed in this release.
          files: |
            dist/Claire-*.apk
            dist/SHA256SUMS.txt
          # Keep the notes to only what changed: GitHub's generated notes append
          # contributor handles, PR links, and a Full Changelog URL that expose
          # the account name, so they are turned off.
          generate_release_notes: false
