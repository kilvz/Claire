# Regenerate loop snapshots. The LoopScenarioTest goldens in
# core/src/test/resources/loop-snapshots record the exact system prompt and
# tool list each scenario sends to the model, so any prompt or tool change
# (for example a rebrand) makes them stale. Regenerating needs the real test
# run, so it happens here on GitHub Actions, never locally:
# dispatch this workflow, it rewrites the snapshots on main and pushes.
name: Regenerate loop snapshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    name: regenerate snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Regenerate snapshots
        run: ./gradlew :core:test --tests '*LoopScenarioTest' --tests '*PromptSurfaceTest' -PupdateSnapshots --stacktrace
      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add core/src/test/resources/loop-snapshots core/src/test/resources/prompt-surface
          git diff --cached --quiet && echo "No snapshot changes." || (git commit -m "Regenerate loop and prompt snapshots" && git push)
