name: CI

# CI only: unit tests, Android packaging, CLI contract, and relay integration. Publishing (CD) is still a manual process.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pushing new commits to the same PR cancels the previous unfinished run; pushes to main each run to completion.
# Pushes and manual triggers each get their own group keyed by run_id, so later runs do not cancel them.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  core:
    name: core (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # Default cache policy: writable on the default branch, read-only on other branches (including PRs).
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Unit tests
        run: ./gradlew :core:test --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-results
          path: |
            core/build/test-results/test
            core/build/reports/tests/test
          retention-days: 7
          if-no-files-found: ignore

  cli:
    name: cli (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # cliTest first runs cliContractTest (invoking the Python CLI through a real subprocess), then the unittest suite under companions/mika/tests.
      - name: CLI tests
        run: ./gradlew :core:cliTest -PmikaPython=python3 --stacktrace
      - name: Translation tool tests
        run: python3 -m unittest discover -s tools/i18n -v
      - name: Translation resource checks
        run: python3 tools/i18n/translations.py check
      - name: English-only checks
        run: python3 tools/english/check.py
      - name: Log export tool tests
        run: python3 -m unittest discover -s tools -p 'test_pull_logs.py' -v
      - name: Voice pack tool tests
        run: python3 -m unittest discover -s tools/voice-models -v
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cli-test-results
          path: |
            core/build/test-results/cliContractTest
            core/build/reports/tests/cliContractTest
          retention-days: 7
          if-no-files-found: ignore

  app:
    name: app (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # compileSdk 36; the build-tools version uses the AGP 8.7.3 default. The action also accepts the SDK licenses.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # assembleDebug verifies packaging paths that unit tests cannot reach: the 31MB rootfs, legacy jniLibs extraction, AIDL, and Compose.
      # Compiles the device tests to catch regressions such as settings interactions; no device is attached here, so instrumentation does not run.
      - name: Unit tests, debug build, and device test compilation
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:compileDebugAndroidTestKotlin --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-test-results
          path: |
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
          retention-days: 7
          if-no-files-found: ignore

  relay:
    name: relay (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v7
        with:
          go-version-file: companions/relay/go.mod
          cache: true
          cache-dependency-path: companions/relay/go.sum
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Relay Go unit tests
        working-directory: companions/relay
        run: go test ./...
      # relayTest first runs go build for the real relay, then exercises the full Kotlin→relay→tunnel path over loopback.
      - name: Relay integration test
        run: ./gradlew :core:relayTest --stacktrace
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relay-test-results
          path: |
            core/build/test-results/relayTest
            core/build/reports/tests/relayTest
          retention-days: 7
          if-no-files-found: ignore
