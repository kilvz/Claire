name: Device compatibility report
description: Paste the report from Mika's compatibility self-check and tell us what works on your phone
title: "[Compatibility] "
body:
  - type: markdown
    attributes:
      value: |
        In Mika, open **Settings › Recovery & repair › Compatibility self-check** and tap "Start" (about 1 minute). When it finishes, "Report on GitHub" copies the report and opens this page; paste it into "Self-check report" below.
        The report only has the phone model, system version and the result of each check, with no accounts, app lists or your content. Please read it before posting.
  - type: input
    id: model
    attributes:
      label: Phone model
      description: Manufacturer and model
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Android and system version
      description: Android version, plus the phone's own system version if it has one
    validations:
      required: true
  - type: input
    id: mika-version
    attributes:
      label: Mika version
      description: Settings › About Mika
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Self-check report
      description: Paste the whole self-check report
      render: text
    validations:
      required: true
  - type: dropdown
    id: pairing
    attributes:
      label: Did phone control pairing work?
      options:
        - Yes
        - No
        - Started from a computer over USB
        - Didn't try
    validations:
      required: true
  - type: dropdown
    id: tasks
    attributes:
      label: Do tasks that use phone apps run?
      options:
        - Yes
        - Partly
        - No
        - Didn't try
    validations:
      required: true
  - type: checkboxes
    id: failed
    attributes:
      label: Which checks didn't pass?
      description: Tick the ones the report shows as failed or partial (none if all passed)
      options:
        - label: Device
        - label: Permissions
        - label: Built-in helper
        - label: Virtual display
        - label: Opening apps
        - label: Reading the screen
        - label: Taps and typing
        - label: Keeps running
        - label: Your screen undisturbed
        - label: Built-in browser
        - label: Sandbox
        - label: App copies
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: What you saw and what the task was (no accounts, passwords or private content)
