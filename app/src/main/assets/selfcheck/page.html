<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claire self-check page</title>
<style>
  body { font-family: sans-serif; margin: 24px; color: #111; background: #fff; }
  button { font-size: 18px; padding: 12px 20px; }
  p { font-size: 16px; }
</style>
</head>
<body>
<!-- Local page for the compatibility self-check: bundled with the app, never online. The self-check reads out the line below, then taps the button to confirm the state changed -->
<h1>Claire self-check page</h1>
<p id="marker">This is Claire's own local test page. SELFCHECK-READ-OK</p>
<button id="selfcheck-button" type="button" onclick="clicked()">Tap me</button>
<p id="status">Clicked 0</p>
<script>
  var clicks = 0;
  function clicked() {
    clicks++;
    document.getElementById('status').textContent = 'Clicked ' + clicks;
  }
</script>
</body>
</html>
