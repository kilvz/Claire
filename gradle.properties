org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# The Kotlin backend OOMs under 2g (IR lowering), causing the app (Android) CI job to fail
kotlin.daemon.jvmargs=-Xmx3g
android.useAndroidX=true
# compileSdk 36 is intentional while the upstream pins AGP 8.7.3; the SDK itself builds and runs fine.
android.suppressUnsupportedCompileSdk=36
kotlin.code.style=official
# Do not uninstall the app after on-device tests: uninstalling loses the wireless debugging pairing (the key is stored in the app) and accessibility grants, forcing re-pairing every time
android.injected.androidTest.leaveApksInstalledAfterRun=true
